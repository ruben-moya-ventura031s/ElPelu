<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Métodos de pago · El Pelú</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">EL <span>PELÚ</span></div>
    <div class="nav-group-label">Panel</div>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <div class="nav-group-label">Mantenimientos</div>
    <a class="nav-link" href="clientes.html">Clientes</a>
    <a class="nav-link" href="proveedores.html">Proveedores</a>
    <a class="nav-link" href="productos.html">Productos y materiales</a>
    <a class="nav-link active" href="metodos-pago.html">Métodos de pago</a>
    <div class="nav-group-label">Procesos</div>
    <a class="nav-link" href="pedidos.html">Pedidos a medida</a>
    <a class="nav-link" href="ventas.html">Ventas / Facturación</a>
    <a class="nav-link" href="compras.html">Compras</a>
    <a class="nav-link" href="inventario.html">Inventario</a>
    <a class="nav-link" href="cuentas-cobrar.html">Cuentas por cobrar</a>
    <div class="nav-group-label">Sistema</div>
    <a class="nav-link" href="reportes.html">Reportes</a>
    <a class="nav-link" href="configuracion.html">Configuración</a>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Métodos de pago</h1>
      <div class="user-chip"></div>
    </div>

    <div class="content">
      <div class="toolbar">
        <span></span>
        <button class="btn btn-primary" onclick="nuevoMetodo()">+ Nuevo método</button>
      </div>
      <div class="panel">
        <table>
          <thead><tr><th>Nombre</th><th>Estado</th><th></th></tr></thead>
          <tbody id="tablaMetodos"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="modalMetodo">
  <div class="modal">
    <div class="modal-header">
      <h3 style="font-size:15px;">Nuevo método de pago</h3>
      <button class="btn-icon" onclick="cerrarModal('modalMetodo')">✕</button>
    </div>
    <div class="modal-body">
      <div class="field field-full" id="fNombre">
        <label>Nombre *</label>
        <input type="text" id="nombre" placeholder="Ej. Efectivo, Tarjeta, Transferencia">
        <div class="error-msg">El nombre es obligatorio</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="cerrarModal('modalMetodo')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarMetodo()">Guardar</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/metodos-pago.js"></script>
</body>
</html>
