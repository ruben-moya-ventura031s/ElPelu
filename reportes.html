<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reportes · El Pelú</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">EL <span>PELÚ</span></div>
    <div class="nav-group-label">Panel</div>
    <a class="nav-link" href="dashboard.html">Dashboard</a>
    <div class="nav-group-label">Mantenimientos</div>
    <a class="nav-link" href="clientes.html">Clientes</a>
    <a class="nav-link" href="proveedores.html">Proveedores</a>
    <a class="nav-link" href="productos.html">Productos y materiales</a>
    <a class="nav-link" href="metodos-pago.html">Métodos de pago</a>
    <div class="nav-group-label">Procesos</div>
    <a class="nav-link" href="pedidos.html">Pedidos a medida</a>
    <a class="nav-link" href="ventas.html">Ventas / Facturación</a>
    <a class="nav-link" href="compras.html">Compras</a>
    <a class="nav-link" href="inventario.html">Inventario</a>
    <a class="nav-link" href="cuentas-cobrar.html">Cuentas por cobrar</a>
    <div class="nav-group-label">Sistema</div>
    <a class="nav-link active" href="reportes.html">Reportes</a>
    <a class="nav-link" href="configuracion.html">Configuración</a>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Reportes</h1>
      <div class="user-chip"></div>
    </div>

    <div class="content">
      <div class="toolbar">
        <select id="tipoReporte" class="search-box" style="width:260px;" onchange="cambiarReporte()">
          <option value="ventas">Ventas por fecha</option>
          <option value="compras">Compras por fecha</option>
          <option value="inventarioBajo">Inventario con stock bajo</option>
          <option value="cuentasCobrar">Cuentas por cobrar pendientes</option>
          <option value="pedidosPorEstado">Pedidos a medida por estado</option>
        </select>
        <div id="filtroFechas" style="display:none;align-items:center;gap:8px;">
          <input type="date" id="fechaDesde" class="search-box" style="width:150px;" onchange="cambiarReporte()">
          <span style="color:var(--text-dim);">a</span>
          <input type="date" id="fechaHasta" class="search-box" style="width:150px;" onchange="cambiarReporte()">
        </div>
        <button class="btn btn-outline" onclick="window.print()">Imprimir / exportar</button>
      </div>

      <div class="panel">
        <table>
          <thead id="cabeceraReporte"></thead>
          <tbody id="tablaReporte"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/reportes.js"></script>
</body>
</html>
